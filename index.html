<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longreen Lawn Care — Quotes &amp; Invoices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg-0:#0A1310;
    --bg-1:#101B16;
    --bg-2:#16241D;
    --bg-3:#1E3126;
    --line:#25392E;
    --line-soft:#1A2820;
    --green-500:#2F9E5C;
    --green-400:#43BF74;
    --green-300:#6DDB96;
    --green-glow:rgba(67,191,116,0.18);
    --text-0:#F1F6F3;
    --text-1:#B9C9C0;
    --text-2:#7C9186;
    --amber:#E3A63F;
    --red:#E2695C;
    --paper:#F6F4EC;
    --paper-ink:#1B241E;
    --paper-line:#D9D3C2;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--green-glow);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  a{color:var(--green-300);}

  .app-shell{
    display:flex;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--bg-1);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px 22px 8px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg, var(--green-400), var(--green-500) 70%);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15.5px;
    line-height:1.15;
    color:var(--text-0);
  }
  .brand-sub{
    font-size:10.5px;
    color:var(--text-2);
    letter-spacing:.02em;
  }
  .nav{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    border-radius:var(--radius-md);
    color:var(--text-1);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--bg-2);color:var(--text-0);}
  .nav-item.active{background:var(--bg-3);color:var(--text-0);}
  .nav-item.active svg{opacity:1;color:var(--green-300);}
  .nav-cta{
    margin-top:14px;
    background:var(--green-500);
    color:#08130D;
    font-weight:600;
    border:none;
    border-radius:var(--radius-md);
    padding:11px 12px;
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .12s ease, transform .08s ease;
  }
  .nav-cta:hover{background:var(--green-400);}
  .nav-cta:active{transform:scale(.98);}
  .sidebar-footer{
    margin-top:auto;
    padding:10px 8px 0 8px;
    font-size:11px;
    color:var(--text-2);
    border-top:1px solid var(--line-soft);
    padding-top:14px;
  }
  .sidebar-recent{
    margin-top:20px;
    padding:0 4px;
    overflow-y:auto;
  }
  .sidebar-recent-label{
    font-size:10.5px;
    font-weight:600;
    color:var(--text-2);
    letter-spacing:.03em;
    padding:0 8px 8px 8px;
  }
  .sidebar-recent-empty{
    font-size:11.5px;
    color:var(--text-2);
    padding:6px 8px;
  }
  .sidebar-recent-item{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-radius:var(--radius-sm);
    padding:8px 8px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .sidebar-recent-item:hover{background:var(--bg-2);}
  .sidebar-recent-item .sr-name{
    font-size:12.5px;
    color:var(--text-0);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sidebar-recent-item .sr-meta{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-2);
    margin-top:1px;
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:34px 42px 60px 42px;
  }
  .page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:26px;
    gap:20px;
  }
  .page-title{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    color:var(--text-0);
    margin:0 0 4px 0;
  }
  .page-desc{
    color:var(--text-2);
    font-size:13.5px;
    margin:0;
    max-width:520px;
  }
  .btn{
    border:1px solid var(--line);
    background:var(--bg-2);
    color:var(--text-0);
    padding:10px 16px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:all .12s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--bg-3);border-color:#33493C;}
  .btn-primary{
    background:var(--green-500);
    border-color:var(--green-500);
    color:#08130D;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--green-400);border-color:var(--green-400);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-1);}
  .btn-ghost:hover{background:var(--bg-2);color:var(--text-0);}
  .btn-lg{padding:13px 22px;font-size:14.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- DASHBOARD ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .stat-card{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 18px;
  }
  .stat-label{font-size:11.5px;color:var(--text-2);margin-bottom:8px;}
  .stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-0);}
  .stat-value.accent{color:var(--green-300);}

  .section-label{
    font-size:13px;
    font-weight:600;
    color:var(--text-1);
    margin:0 0 12px 2px;
  }
  .job-table{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .job-row{
    display:grid;
    grid-template-columns:1.4fr 1.4fr 1fr .8fr .8fr .9fr 32px;
    gap:10px;
    padding:14px 18px;
    align-items:center;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
    transition:background .12s ease;
  }
  .job-row:last-child{border-bottom:none;}
  .job-row:hover{background:var(--bg-2);}
  .job-row.head{
    cursor:default;
    color:var(--text-2);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
    padding:12px 18px;
  }
  .job-row.head:hover{background:transparent;}
  .job-cell{font-size:13.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-cell.strong{color:var(--text-0);font-weight:500;}
  .badge{
    display:inline-flex;align-items:center;
    padding:3px 9px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    width:fit-content;
  }
  .badge.paid{background:rgba(67,191,116,.14);color:var(--green-300);}
  .badge.unpaid{background:rgba(227,166,63,.14);color:var(--amber);}
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--text-2);
  }
  .row-delete-btn{
    background:none;
    border:none;
    color:var(--text-2);
    cursor:pointer;
    padding:6px;
    border-radius:var(--radius-sm);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .row-delete-btn:hover{background:rgba(226,105,92,.14);color:var(--red);}
  .empty-state svg{width:38px;height:38px;margin-bottom:14px;opacity:.5;}
  .empty-state p{margin:0 0 16px 0;font-size:13.5px;}

  /* ---------- WIZARD ---------- */
  .wizard-progress{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:30px;
  }
  .wizard-dot{
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--line);
    transition:background .18s ease;
  }
  .wizard-dot.done{background:var(--green-500);}
  .wizard-dot.current{background:var(--green-300);}
  .wizard-step-label{
    color:var(--text-2);
    font-size:12px;
    margin-bottom:6px;
    font-weight:600;
  }
  .wizard-question{
    font-family:var(--font-display);
    font-size:23px;
    font-weight:600;
    margin:0 0 22px 0;
  }
  .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
    max-width:720px;
  }
  .option-tile{
    background:var(--bg-1);
    border:1.5px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 16px;
    cursor:pointer;
    transition:all .12s ease;
    text-align:left;
  }
  .option-tile:hover{border-color:#33493C;background:var(--bg-2);}
  .option-tile.selected{
    border-color:var(--green-400);
    background:var(--bg-3);
    box-shadow:0 0 0 3px var(--green-glow);
  }
  .option-title{font-size:15.5px;font-weight:600;color:var(--text-0);margin-bottom:4px;}
  .option-sub{font-size:12px;color:var(--text-2);}
  .option-tile.selected .option-title{color:var(--green-300);}
  .wizard-nav{
    display:flex;
    justify-content:space-between;
    margin-top:32px;
    max-width:720px;
  }

  /* ---------- RESULT ---------- */
  .result-layout{
    display:grid;
    grid-template-columns:1fr 1.1fr;
    gap:24px;
    max-width:920px;
  }
  .price-card{
    background:radial-gradient(120% 140% at 15% 0%, var(--bg-3), var(--bg-1) 60%);
    border:1px solid #2C4536;
    border-radius:var(--radius-lg);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .price-card::after{
    content:"";
    position:absolute;
    right:-60px;top:-60px;
    width:180px;height:180px;
    background:var(--green-glow);
    border-radius:50%;
    filter:blur(10px);
  }
  .price-eyebrow{font-size:12.5px;color:var(--text-2);font-weight:600;margin-bottom:10px;}
  .price-value{
    font-family:var(--font-display);
    font-size:56px;
    font-weight:700;
    color:var(--text-0);
    line-height:1;
    margin-bottom:4px;
  }
  .price-recommended-note{font-size:12px;color:var(--text-2);margin-bottom:22px;}
  .price-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .detail-card{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 22px;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13.5px;
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-key{color:var(--text-2);}
  .detail-val{color:var(--text-0);font-weight:500;}
  .result-footer-actions{
    display:flex;gap:10px;margin-top:22px;max-width:920px;
  }

  /* adjust price inline editor */
  .adjust-box{
    display:none;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .adjust-box.open{display:flex;}
  .adjust-box input{
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-sm);
    padding:8px 10px;
    font-size:15px;
    width:110px;
    font-family:var(--font-display);
  }

  /* ---------- FORMS (customer info / settings) ---------- */
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    max-width:640px;
  }
  .form-grid.full{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:12.5px;color:var(--text-1);font-weight:500;}
  .field input, .field select{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-md);
    padding:10px 12px;
    font-size:14px;
    outline:none;
    transition:border-color .12s ease;
  }
  .field input:focus, .field select:focus{border-color:var(--green-400);}
  .field-hint{font-size:11px;color:var(--text-2);}
  .toggle-row{
    display:flex;gap:8px;
  }
  .toggle-pill{
    flex:1;
    text-align:center;
    padding:10px 8px;
    border-radius:var(--radius-md);
    border:1px solid var(--line);
    background:var(--bg-1);
    color:var(--text-1);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .toggle-pill.active{
    background:var(--green-500);
    border-color:var(--green-500);
    color:#08130D;
    font-weight:600;
  }
  .customer-picker{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .customer-chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg-1);
    font-size:12.5px;
    color:var(--text-1);
    cursor:pointer;
  }
  .customer-chip:hover{border-color:var(--green-400);color:var(--text-0);}
  .form-actions{display:flex;gap:10px;margin-top:26px;max-width:640px;}
  .collapse-toggle{
    font-size:12.5px;
    color:var(--green-300);
    cursor:pointer;
    background:none;border:none;padding:0;
    margin:4px 0 14px 0;
    font-weight:600;
  }
  .collapse-body{display:none;}
  .collapse-body.open{display:block;}

  /* ---------- SETTINGS ---------- */
  .settings-section{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:18px;
    max-width:760px;
  }
  .settings-section h3{
    font-family:var(--font-display);
    font-size:15.5px;
    margin:0 0 4px 0;
    color:var(--text-0);
  }
  .settings-section .settings-desc{
    font-size:12px;color:var(--text-2);margin:0 0 16px 0;
  }
  .price-input-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }
  .price-input{display:flex;flex-direction:column;gap:5px;}
  .price-input label{font-size:11.5px;color:var(--text-2);}
  .price-input .prefix-wrap{position:relative;}
  .price-input .prefix-wrap span{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--text-2);font-size:13px;
  }
  .price-input input{
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-sm);
    padding:8px 10px 8px 22px;
    font-size:13.5px;
    width:100%;
  }
  .payment-methods-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .pm-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--bg-2);
    border:1px solid var(--line);
    padding:6px 10px 6px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .pm-chip button{
    background:none;border:none;color:var(--text-2);cursor:pointer;
    font-size:14px;line-height:1;padding:0;
  }
  .pm-chip button:hover{color:var(--red);}
  .add-pm-row{display:flex;gap:8px;}
  .add-pm-row input{flex:1;}
  .settings-save-bar{
    position:sticky;bottom:0;
    background:linear-gradient(0deg, var(--bg-0) 60%, transparent);
    padding:18px 0 0 0;
    max-width:760px;
    display:flex;gap:10px;align-items:center;
  }
  .save-confirm{font-size:12.5px;color:var(--green-300);opacity:0;transition:opacity .2s ease;}
  .save-confirm.show{opacity:1;}

  /* ---------- INVOICE PREVIEW ---------- */
  .invoice-toolbar{
    display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;
    align-items:center;
  }
  .invoice-toolbar .status-toggle{margin-left:auto;display:flex;gap:8px;}
  .paper-wrap{
    background:#0000;
    display:flex;
    justify-content:center;
  }
  #invoice-paper{
    background:var(--paper);
    color:var(--paper-ink);
    width:100%;
    max-width:680px;
    padding:52px 48px;
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    font-family:var(--font-body);
  }
  .inv-header-title{
    font-family:var(--font-display);
    font-size:12.5px;
    letter-spacing:.14em;
    color:#5C6B60;
    margin:0 0 22px 0;
  }
  .inv-business-name{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    color:var(--green-500);
    margin:0 0 6px 0;
  }
  .inv-business-meta{
    font-size:12.5px;
    color:#4C5850;
    margin:0 0 2px 0;
  }
  .inv-divider{border:none;border-top:1px solid var(--paper-line);margin:22px 0;}
  .inv-meta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    font-size:13px;
  }
  .inv-meta-grid div span.k{color:#6B7A6F;}
  .inv-meta-grid div span.v{font-weight:600;color:var(--paper-ink);}
  .inv-section-title{
    font-size:11px;
    letter-spacing:.1em;
    color:#6B7A6F;
    font-weight:700;
    margin:0 0 10px 0;
  }
  .inv-bill-to p{margin:0 0 4px 0;font-size:13.5px;}
  .inv-table{width:100%;border-collapse:collapse;margin:6px 0 4px 0;}
  .inv-table th{
    text-align:left;
    font-size:11px;
    letter-spacing:.06em;
    color:#6B7A6F;
    padding:8px 0;
    border-bottom:1.5px solid var(--paper-ink);
  }
  .inv-table th.amt, .inv-table td.amt{text-align:right;}
  .inv-table td{
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
    font-size:13.5px;
    vertical-align:top;
  }
  .inv-service-name{font-weight:700;}
  .inv-service-desc{color:#4C5850;font-size:12.5px;margin-top:3px;}
  .inv-totals{
    margin-top:16px;
    margin-left:auto;
    width:260px;
  }
  .inv-totals .row{
    display:flex;justify-content:space-between;
    font-size:13px;padding:5px 0;color:#3C463F;
  }
  .inv-totals .row.total{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:700;
    color:var(--paper-ink);
    border-top:1.5px solid var(--paper-ink);
    margin-top:6px;
    padding-top:12px;
  }
  .inv-payment-row{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;}
  .inv-thanks{
    text-align:center;
    font-family:var(--font-display);
    font-size:14px;
    font-weight:600;
    color:var(--green-500);
    margin-top:28px;
  }

  @media (max-width:980px){
    .result-layout{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .field.span-2{grid-column:span 1;}
  }
  @media (max-width:760px){
    .app-shell{flex-direction:column;}

    .job-row{grid-template-columns:1fr 1fr;row-gap:4px;position:relative;padding-right:38px;}
    .job-row .job-cell:nth-child(3),
    .job-row .job-cell:nth-child(5){display:none;}
    .job-row.head{display:none;}
    .row-delete-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);}

  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */
const DEFAULT_CONFIG = {
  business:{
    name:"Longreen Lawn Care",
    phone:"719-352-7696",
    email:"contactlongreen@gmail.com",
    location:"Colorado Springs, Colorado 80906"
  },
  pricing:{
    lawnSize:{ mini:25, small:32, medium:40, large:52, xlarge:68 },
    weedeating:{ none:-5, light:0, normal:8, heavy:18 },
    edging:{ no:0, yes:8 },
    blowing:{ no:0, yes:5 },
    overgrowth:{ low:-5, normal:0, high:15 },
    travel:{ "0-5":0, "5-10":5, "10+":12 },
    minimumJobPrice:30
  },
  time:{
    lawnSize:{ mini:20, small:30, medium:45, large:60, xlarge:80 },
    weedeating:{ none:0, light:5, normal:10, heavy:20 },
    edging:{ no:0, yes:10 },
    blowing:{ no:0, yes:5 },
    overgrowth:{ low:-5, normal:0, high:15 }
  },
  taxRate:0,
  paymentMethods:["Cash","Check","PayPal","Venmo"]
};

const LABELS = {
  lawnSize:{ mini:"Mini", small:"Small", medium:"Medium", large:"Large", xlarge:"2× Large" },
  weedeating:{ none:"None", light:"Light", normal:"Normal", heavy:"Heavy" },
  edging:{ no:"No", yes:"Yes" },
  blowing:{ no:"No", yes:"Yes" },
  overgrowth:{ low:"Low", normal:"Normal", high:"High" },
  travel:{ "0-5":"0–5 miles", "5-10":"5–10 miles", "10+":"10+ miles" }
};

const DESC_WEEDEATING = { light:"Light Weedeating", normal:"Weedeating", heavy:"Heavy Weedeating" };

const WIZARD_STEPS = [
  { key:"size", question:"What size is the lawn?", options:[
      {v:"mini", t:"Mini", s:"Tiny lot or patch"},
      {v:"small", t:"Small", s:"Typical small yard"},
      {v:"medium", t:"Medium", s:"Standard residential"},
      {v:"large", t:"Large", s:"Big residential lot"},
      {v:"xlarge", t:"2× Large", s:"Very large property"}
    ]},
  { key:"weedeating", question:"How much weedeating?", options:[
      {v:"none", t:"None", s:"Skip weedeating"},
      {v:"light", t:"Light", s:"Quick touch-up"},
      {v:"normal", t:"Normal", s:"Standard pass"},
      {v:"heavy", t:"Heavy", s:"Overgrown edges"}
    ]},
  { key:"edging", question:"Include edging?", options:[
      {v:"no", t:"No", s:"Skip edging"},
      {v:"yes", t:"Yes", s:"Edge walkways & beds"}
    ]},
  { key:"blowing", question:"Include blowing?", options:[
      {v:"no", t:"No", s:"Skip blowing"},
      {v:"yes", t:"Yes", s:"Clear clippings & debris"}
    ]},
  { key:"overgrowth", question:"How overgrown is the property?", options:[
      {v:"low", t:"Low", s:"Well maintained"},
      {v:"normal", t:"Normal", s:"Typical growth"},
      {v:"high", t:"High", s:"Significant overgrowth"}
    ]},
  { key:"travel", question:"How far is the travel distance?", options:[
      {v:"0-5", t:"0–5 miles", s:"Close by"},
      {v:"5-10", t:"5–10 miles", s:"Short drive"},
      {v:"10+", t:"10+ miles", s:"Longer drive"}
    ]}
];

/* =========================================================
   STORAGE
   Wrapped so a blocked/unavailable localStorage (common when a
   file is opened directly as file:// in Safari, or in private
   browsing) never throws and silently kills a button click —
   it falls back to an in-memory store for the session instead.
========================================================= */
const memoryFallback = {};
let usingMemoryFallback = false;

function safeGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ usingMemoryFallback = true; return memoryFallback[key] ?? null; }
}
function safeSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){ usingMemoryFallback = true; memoryFallback[key] = value; }
}

const Store = {
  getConfig(){
    const raw = safeGet("longreen_config");
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    try{
      const parsed = JSON.parse(raw);
      return deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), parsed);
    }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
  },
  setConfig(cfg){ safeSet("longreen_config", JSON.stringify(cfg)); },
  getCustomers(){ try{ return JSON.parse(safeGet("longreen_customers") || "[]"); }catch(e){ return []; } },
  setCustomers(list){ safeSet("longreen_customers", JSON.stringify(list)); },
  getJobs(){ try{ return JSON.parse(safeGet("longreen_jobs") || "[]"); }catch(e){ return []; } },
  setJobs(list){ safeSet("longreen_jobs", JSON.stringify(list)); }
};
function deepMerge(base, override){
  for(const k in override){
    if(override[k] && typeof override[k] === "object" && !Array.isArray(override[k])){
      base[k] = deepMerge(base[k] || {}, override[k]);
    }else{
      base[k] = override[k];
    }
  }
  return base;
}

/* =========================================================
   STATE
========================================================= */
const State = {
  page:"dashboard",
  wizardStep:0,
  selections:{},
  manualPrice:null,
  activeJob:null,       // job being viewed/created
  editingCustomerId:null,
  invoiceDraft:null
};

/* =========================================================
   PRICING ENGINE
========================================================= */
function computeRecommendedPrice(config, sel){
  const p = config.pricing;
  let price = p.lawnSize[sel.size] + p.weedeating[sel.weedeating] + p.edging[sel.edging]
    + p.blowing[sel.blowing] + p.overgrowth[sel.overgrowth] + p.travel[sel.travel];
  return Math.max(Math.round(price), p.minimumJobPrice);
}
function computeDurationMinutes(config, sel){
  const t = config.time;
  let mins = t.lawnSize[sel.size] + t.weedeating[sel.weedeating] + t.edging[sel.edging]
    + t.blowing[sel.blowing] + t.overgrowth[sel.overgrowth];
  return Math.max(Math.round(mins), 10);
}
function buildServiceDescription(sel){
  const parts = [LABELS.lawnSize[sel.size], "Mowing"];
  if(sel.weedeating !== "none") parts.push(DESC_WEEDEATING[sel.weedeating]);
  if(sel.edging === "yes") parts.push("Edging");
  if(sel.blowing === "yes") parts.push("Blowing");
  if(sel.overgrowth === "high") parts.push("Overgrowth Cleanup");
  return parts.join(" · ");
}
function formatMoney(n){
  return "$" + (Math.round(n * 100) / 100).toFixed(2);
}
function formatDuration(mins){
  if(mins < 60) return mins + " min";
  const h = Math.floor(mins/60), m = mins % 60;
  return h + "h" + (m ? " " + m + "m" : "");
}

/* =========================================================
   UTIL
========================================================= */
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function formatDateNice(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}
function nextInvoiceNumber(){
  const jobs = Store.getJobs();
  let max = 0;
  jobs.forEach(j=>{
    const m = /(\d+)$/.exec(j.invoiceNumber || "");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "LG-" + String(max+1).padStart(4,"0");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove("show"), 2600);
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   ROUTER / RENDER
========================================================= */
const main = document.getElementById("main");

function navigate(page){
  State.page = page;
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.classList.toggle("active", el.dataset.nav === page);
  });
  render();
}
document.querySelectorAll(".nav-item").forEach(el=>{
  el.addEventListener("click", ()=> navigate(el.dataset.nav));
});
document.getElementById("new-quote-btn").addEventListener("click", startNewQuote);

function startNewQuote(){
  State.wizardStep = 0;
  State.selections = {};
  State.manualPrice = null;
  State.activeJob = null;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.remove("active"));
  State.page = "wizard";
  render();
}

function render(){
  renderSidebarRecent();
  if(State.page === "dashboard") return renderDashboard();
  if(State.page === "wizard") return renderWizard();
  if(State.page === "result") return renderResult();
  if(State.page === "customerInfo") return renderCustomerInfo();
  if(State.page === "invoice") return renderInvoice();
  if(State.page === "settings") return renderSettings();
}

function renderSidebarRecent(){
  const el = document.getElementById("sidebar-recent-list");
  if(!el) return;
  const jobs = Store.getJobs().slice().sort((a,b)=> (b.createdAt||0) - (a.createdAt||0)).slice(0,5);
  if(jobs.length === 0){
    el.innerHTML = `<div class="sidebar-recent-empty">No invoices yet</div>`;
    return;
  }
  el.innerHTML = jobs.map(j=>`
    <button class="sidebar-recent-item" data-job="${j.id}">
      <div class="sr-name">${escapeHtml(j.customerName || "—")}</div>
      <div class="sr-meta"><span>${escapeHtml(j.invoiceNumber)}</span><span>${formatMoney(j.total)}</span></div>
    </button>
  `).join("");
  el.querySelectorAll(".sidebar-recent-item").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const job = Store.getJobs().find(j=>j.id === btn.dataset.job);
      if(job){
        State.activeJob = job;
        State.page = "invoice";
        document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
        render();
      }
    });
  });
}

/* ---------------- DASHBOARD ---------------- */
function renderDashboard(){
  const jobs = Store.getJobs().slice().sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  const totalRevenue = jobs.reduce((s,j)=> s + (j.paymentStatus === "Paid" ? j.total : 0), 0);
  const outstanding = jobs.reduce((s,j)=> s + (j.paymentStatus === "Paid" ? 0 : j.total), 0);
  const thisMonthCount = jobs.filter(j=>{
    const d = new Date(j.createdAt || 0);
    const n = new Date();
    return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
  }).length;

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-desc">Your quotes and invoices, all in one place.</p>
      </div>
      <button class="btn btn-primary btn-lg" id="dash-new-quote">+ New Quote</button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Jobs this month</div>
        <div class="stat-value">${thisMonthCount}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total jobs</div>
        <div class="stat-value">${jobs.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Collected</div>
        <div class="stat-value accent">${formatMoney(totalRevenue)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Outstanding</div>
        <div class="stat-value" style="color:var(--amber)">${formatMoney(outstanding)}</div>
      </div>
    </div>

    <div class="section-label">Recent jobs</div>
    ${jobs.length === 0 ? `
      <div class="job-table">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg>
          <p>No jobs yet. Start your first quote to get going.</p>
          <button class="btn btn-primary" id="dash-empty-new-quote">+ New Quote</button>
        </div>
      </div>
    ` : `
      <div class="job-table">
        <div class="job-row head">
          <div>Customer</div><div>Property</div><div>Service Date</div><div>Price</div><div>Status</div><div>Invoice #</div><div></div>
        </div>
        ${jobs.map(j=>`
          <div class="job-row" data-job="${j.id}">
            <div class="job-cell strong">${escapeHtml(j.customerName || "—")}</div>
            <div class="job-cell">${escapeHtml(j.propertyAddress || "—")}</div>
            <div class="job-cell">${formatDateNice(j.serviceDate)}</div>
            <div class="job-cell strong">${formatMoney(j.total)}</div>
            <div><span class="badge ${j.paymentStatus === 'Paid' ? 'paid' : 'unpaid'}">${j.paymentStatus}</span></div>
            <div class="job-cell">${escapeHtml(j.invoiceNumber)}</div>
            <div><button class="row-delete-btn" data-delete-job="${j.id}" title="Delete invoice" aria-label="Delete invoice">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-9 0 1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
            </button></div>
          </div>
        `).join("")}
      </div>
    `}
  `;
  document.getElementById("dash-new-quote")?.addEventListener("click", startNewQuote);
  document.getElementById("dash-empty-new-quote")?.addEventListener("click", startNewQuote);
  document.querySelectorAll(".job-row[data-job]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const job = Store.getJobs().find(j=>j.id === el.dataset.job);
      if(job){ State.activeJob = job; State.page = "invoice"; render(); }
    });
  });
  document.querySelectorAll("[data-delete-job]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      deleteJob(btn.dataset.deleteJob);
    });
  });
}

function deleteJob(jobId){
  const jobs = Store.getJobs();
  const job = jobs.find(j=>j.id === jobId);
  if(!job) return;
  if(!confirm(`Delete invoice ${job.invoiceNumber} for ${job.customerName}? This can't be undone.`)) return;
  Store.setJobs(jobs.filter(j=>j.id !== jobId));
  if(State.activeJob && State.activeJob.id === jobId){
    State.activeJob = null;
    navigate("dashboard");
  }else{
    render();
  }
  showToast("Invoice deleted.");
}

/* ---------------- WIZARD ---------------- */
function renderWizard(){
  const step = WIZARD_STEPS[State.wizardStep];
  const total = WIZARD_STEPS.length;
  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">New Quote</h1>
        <p class="page-desc">Step ${State.wizardStep+1} of ${total}</p>
      </div>
      <button class="btn btn-ghost" id="wizard-cancel">Cancel</button>
    </div>

    <div class="wizard-progress">
      ${WIZARD_STEPS.map((s,i)=>`<div class="wizard-dot ${i < State.wizardStep ? 'done' : i === State.wizardStep ? 'current' : ''}"></div>`).join("")}
    </div>

    <h2 class="wizard-question">${step.question}</h2>
    <div class="option-grid">
      ${step.options.map(o=>`
        <button class="option-tile ${State.selections[step.key] === o.v ? 'selected' : ''}" data-value="${o.v}">
          <div class="option-title">${o.t}</div>
          <div class="option-sub">${o.s}</div>
        </button>
      `).join("")}
    </div>

    <div class="wizard-nav">
      <button class="btn" id="wizard-back" ${State.wizardStep === 0 ? "disabled" : ""}>← Back</button>
      <button class="btn btn-primary" id="wizard-next" ${State.selections[step.key] ? "" : "disabled"}>
        ${State.wizardStep === total-1 ? "See Price →" : "Next →"}
      </button>
    </div>
  `;

  document.getElementById("wizard-cancel").addEventListener("click", ()=> navigate("dashboard"));
  document.querySelectorAll(".option-tile").forEach(el=>{
    el.addEventListener("click", ()=>{
      State.selections[step.key] = el.dataset.value;
      if(State.wizardStep < total-1){
        State.wizardStep++;
      }
      render();
      if(State.wizardStep === total-1 && Object.keys(State.selections).length === total){
        // stay, user confirms with button
      }
    });
  });
  document.getElementById("wizard-back").addEventListener("click", ()=>{
    if(State.wizardStep > 0){ State.wizardStep--; render(); }
  });
  document.getElementById("wizard-next").addEventListener("click", ()=>{
    if(State.wizardStep === total-1){
      State.manualPrice = null;
      State.page = "result";
      render();
    }else{
      State.wizardStep++;
      render();
    }
  });
}

/* ---------------- RESULT ---------------- */
function renderResult(){
  const config = Store.getConfig();
  const sel = State.selections;
  const recommended = computeRecommendedPrice(config, sel);
  const finalPrice = State.manualPrice !== null ? State.manualPrice : recommended;
  const duration = computeDurationMinutes(config, sel);
  const hourly = finalPrice / (duration/60);

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Quote Result</h1>
        <p class="page-desc">Review the recommended price before creating the invoice.</p>
      </div>
      <button class="btn btn-ghost" id="result-start-over">Start Over</button>
    </div>

    <div class="result-layout">
      <div class="price-card">
        <div class="price-eyebrow">Recommended price</div>
        <div class="price-value">${formatMoney(finalPrice)}</div>
        <div class="price-recommended-note">${State.manualPrice !== null ? "Adjusted · auto-recommended " + formatMoney(recommended) : "Auto-calculated from job details"}</div>
        <div class="price-actions">
          <button class="btn" id="btn-adjust">Adjust Price</button>
          <button class="btn btn-primary" id="btn-create-invoice">Create Invoice</button>
        </div>
        <div class="adjust-box" id="adjust-box">
          <input type="number" id="adjust-input" step="1" value="${finalPrice}">
          <button class="btn btn-primary" id="adjust-apply">Apply</button>
          <button class="btn btn-ghost" id="adjust-reset">Reset</button>
        </div>
      </div>

      <div class="detail-card">
        <div class="detail-row"><span class="detail-key">Lawn size</span><span class="detail-val">${LABELS.lawnSize[sel.size]}</span></div>
        <div class="detail-row"><span class="detail-key">Weedeating</span><span class="detail-val">${LABELS.weedeating[sel.weedeating]}</span></div>
        <div class="detail-row"><span class="detail-key">Edging</span><span class="detail-val">${LABELS.edging[sel.edging]}</span></div>
        <div class="detail-row"><span class="detail-key">Blowing</span><span class="detail-val">${LABELS.blowing[sel.blowing]}</span></div>
        <div class="detail-row"><span class="detail-key">Overgrowth</span><span class="detail-val">${LABELS.overgrowth[sel.overgrowth]}</span></div>
        <div class="detail-row"><span class="detail-key">Travel</span><span class="detail-val">${LABELS.travel[sel.travel]}</span></div>
        <div class="detail-row"><span class="detail-key">Estimated job time</span><span class="detail-val">${formatDuration(duration)}</span></div>
        <div class="detail-row"><span class="detail-key">Estimated hourly earnings</span><span class="detail-val">${formatMoney(hourly)}/hr</span></div>
      </div>
    </div>
  `;

  document.getElementById("result-start-over").addEventListener("click", startNewQuote);
  document.getElementById("btn-adjust").addEventListener("click", ()=>{
    document.getElementById("adjust-box").classList.toggle("open");
  });
  document.getElementById("adjust-apply").addEventListener("click", ()=>{
    const v = parseFloat(document.getElementById("adjust-input").value);
    if(!isNaN(v) && v >= 0){ State.manualPrice = Math.round(v*100)/100; render(); }
  });
  document.getElementById("adjust-reset").addEventListener("click", ()=>{
    State.manualPrice = null; render();
  });
  document.getElementById("btn-create-invoice").addEventListener("click", ()=>{
    State.page = "customerInfo";
    render();
  });
}

/* ---------------- CUSTOMER INFO ---------------- */
function renderCustomerInfo(){
  const config = Store.getConfig();
  const sel = State.selections;
  const recommended = computeRecommendedPrice(config, sel);
  const finalPrice = State.manualPrice !== null ? State.manualPrice : recommended;
  const customers = Store.getCustomers();
  const invoiceNumber = nextInvoiceNumber();
  const today = todayISO();

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Customer &amp; Invoice Info</h1>
        <p class="page-desc">Just the details needed to send the invoice.</p>
      </div>
      <button class="btn btn-ghost" id="ci-back">← Back to price</button>
    </div>

    ${customers.length ? `
      <div class="section-label">Use a saved customer</div>
      <div class="customer-picker">
        ${customers.map(c=>`<button class="customer-chip" data-cid="${c.id}">${escapeHtml(c.name)}</button>`).join("")}
      </div>
    ` : ""}

    <form id="ci-form">
      <div class="form-grid">
        <div class="field span-2">
          <label>Customer Name</label>
          <input type="text" id="f-name" required placeholder="Jane Smith">
        </div>
        <div class="field span-2">
          <label>Property Address</label>
          <input type="text" id="f-address" required placeholder="123 Maple St, Colorado Springs, CO">
        </div>
        <div class="field">
          <label>Customer Phone</label>
          <input type="tel" id="f-phone" placeholder="(719) 555-0100">
        </div>
        <div class="field">
          <label>Customer Email</label>
          <input type="email" id="f-email" placeholder="jane@email.com">
        </div>
        <div class="field">
          <label>Invoice Number</label>
          <input type="text" id="f-invnum" value="${invoiceNumber}">
        </div>
        <div class="field">
          <label>Invoice Date</label>
          <input type="date" id="f-invdate" value="${today}">
        </div>
        <div class="field">
          <label>Service Date</label>
          <input type="date" id="f-servdate" value="${today}">
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="f-duedate" value="${today}">
        </div>
        <div class="field">
          <label>Payment Method</label>
          <select id="f-paymethod">
            ${config.paymentMethods.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}
          </select>
        </div>
        <div class="field span-2">
          <label>Payment Status</label>
          <div class="toggle-row">
            <div class="toggle-pill active" data-status="Unpaid">Unpaid</div>
            <div class="toggle-pill" data-status="Paid">Paid</div>
          </div>
        </div>
      </div>

      <button type="button" class="collapse-toggle" id="adj-toggle">+ Add discount or tax adjustment</button>
      <div class="collapse-body" id="adj-body">
        <div class="form-grid">
          <div class="field">
            <label>Discount ($)</label>
            <input type="number" id="f-discount" value="0" step="0.01" min="0">
          </div>
          <div class="field">
            <label>Tax (%)</label>
            <input type="number" id="f-tax" value="${config.taxRate}" step="0.01" min="0">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-lg">Generate Invoice →</button>
      </div>
    </form>
  `;

  document.getElementById("ci-back").addEventListener("click", ()=>{ State.page = "result"; render(); });

  let paymentStatus = "Unpaid";
  document.querySelectorAll(".toggle-pill").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.querySelectorAll(".toggle-pill").forEach(p=>p.classList.remove("active"));
      el.classList.add("active");
      paymentStatus = el.dataset.status;
    });
  });

  document.getElementById("adj-toggle").addEventListener("click", ()=>{
    const body = document.getElementById("adj-body");
    const open = body.classList.toggle("open");
    document.getElementById("adj-toggle").textContent = open ? "− Hide discount / tax adjustment" : "+ Add discount or tax adjustment";
  });

  document.querySelectorAll(".customer-chip").forEach(el=>{
    el.addEventListener("click", ()=>{
      const c = customers.find(x=>x.id === el.dataset.cid);
      if(!c) return;
      document.getElementById("f-name").value = c.name;
      document.getElementById("f-address").value = c.address;
      document.getElementById("f-phone").value = c.phone || "";
      document.getElementById("f-email").value = c.email || "";
      State.editingCustomerId = c.id;
    });
  });

  document.getElementById("ci-form").addEventListener("submit", (e)=>{
    e.preventDefault();
    try{
      submitInvoiceForm();
    }catch(err){
      console.error(err);
      showToast("Something went wrong generating the invoice — please try again.");
    }
  });

  function submitInvoiceForm(){
    const name = document.getElementById("f-name").value.trim();
    const address = document.getElementById("f-address").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const email = document.getElementById("f-email").value.trim();
    if(!name || !address){ showToast("Customer name and property address are required."); return; }

    // save / update customer
    let customerId = State.editingCustomerId;
    const list = Store.getCustomers();
    if(customerId){
      const idx = list.findIndex(c=>c.id === customerId);
      if(idx > -1){ list[idx] = { ...list[idx], name, address, phone, email }; }
    }else{
      const existing = list.find(c=> c.name.toLowerCase() === name.toLowerCase() && c.address.toLowerCase() === address.toLowerCase());
      if(existing){
        customerId = existing.id;
        existing.phone = phone || existing.phone;
        existing.email = email || existing.email;
      }else{
        customerId = uid("cust");
        list.push({ id:customerId, name, address, phone, email });
      }
    }
    Store.setCustomers(list);

    const discount = parseFloat(document.getElementById("f-discount")?.value || 0) || 0;
    const taxPct = parseFloat(document.getElementById("f-tax")?.value || 0) || 0;
    const subtotal = finalPrice;
    const tax = Math.round((subtotal - discount) * (taxPct/100) * 100) / 100;
    const total = Math.round((subtotal - discount + tax) * 100) / 100;

    const job = {
      id: uid("job"),
      invoiceNumber: document.getElementById("f-invnum").value.trim() || invoiceNumber,
      customerId, customerName:name, propertyAddress:address, customerPhone:phone, customerEmail:email,
      invoiceDate: document.getElementById("f-invdate").value,
      serviceDate: document.getElementById("f-servdate").value,
      dueDate: document.getElementById("f-duedate").value,
      paymentMethod: document.getElementById("f-paymethod").value,
      paymentStatus,
      quote:{ ...sel, price:finalPrice, recommended, duration:computeDurationMinutes(config, sel), description: buildServiceDescription(sel) },
      subtotal, discount, taxPct, tax, total,
      createdAt: Date.now()
    };

    const jobs = Store.getJobs();
    jobs.push(job);
    Store.setJobs(jobs);

    State.activeJob = job;
    State.page = "invoice";
    render();
  }
}

  document.getElementById("inv-back").addEventListener("click", ()=> navigate("dashboard"));
  document.getElementById("inv-print").addEventListener("click", ()=> window.print());

  document.getElementById("inv-mark-unpaid").addEventListener("click", ()=> setJobStatus(job.id, "Unpaid"));
  document.getElementById("inv-pdf").addEventListener("click", ()=> downloadInvoicePdf(job));
  document.getElementById("inv-share").addEventListener("click", ()=> shareInvoice(job));

function setJobStatus(jobId, status){
  const jobs = Store.getJobs();
  const idx = jobs.findIndex(j=>j.id === jobId);
  if(idx > -1){
    jobs[idx].paymentStatus = status;
    Store.setJobs(jobs);
    State.activeJob = jobs[idx];
    render();
    showToast("Marked as " + status);
  }
}

function downloadInvoicePdf(job){
  const el = document.getElementById("invoice-paper");
  const opt = {
    margin:0,
    filename:`${job.invoiceNumber}-${job.customerName.replace(/\s+/g,'-')}.pdf`,
    image:{ type:"jpeg", quality:0.98 },
    html2canvas:{ scale:2, backgroundColor:"#F6F4EC" },
    jsPDF:{ unit:"pt", format:"letter", orientation:"portrait" }
  };
  if(typeof html2pdf === "undefined"){
    showToast("PDF library failed to load — check your internet connection.");
    return;
  }
  showToast("Preparing PDF…");
  html2pdf().set(opt).from(el).save();
}

function shareInvoice(job){
  const summary = `Invoice ${job.invoiceNumber} — ${job.customerName}\n${job.quote.description}\nTotal Due: ${formatMoney(job.total)}\nStatus: ${job.paymentStatus}\n\nLongreen Lawn Care · 719-352-7696`;
  if(navigator.share){
    navigator.share({ title:`Invoice ${job.invoiceNumber}`, text:summary }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(summary);
    showToast("Invoice summary copied — paste it into a text or email.");
  }
}
