<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longreen Lawn Care — Quotes &amp; Invoices</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A1310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Longreen">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg-0:#0A1310;
    --bg-1:#101B16;
    --bg-2:#16241D;
    --bg-3:#1E3126;
    --line:#25392E;
    --line-soft:#1A2820;
    --green-500:#2F9E5C;
    --green-400:#43BF74;
    --green-300:#6DDB96;
    --green-glow:rgba(67,191,116,0.18);
    --text-0:#F1F6F3;
    --text-1:#B9C9C0;
    --text-2:#7C9186;
    --amber:#E3A63F;
    --red:#E2695C;
    --paper:#F6F4EC;
    --paper-ink:#1B241E;
    --paper-line:#D9D3C2;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--green-glow);}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  a{color:var(--green-300);}

  .app-shell{
    display:flex;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--bg-1);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:22px 14px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px 22px 8px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(155deg, var(--green-400), var(--green-500) 70%);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:19px;height:19px;}
  .brand-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:15.5px;
    line-height:1.15;
    color:var(--text-0);
  }
  .brand-sub{
    font-size:10.5px;
    color:var(--text-2);
    letter-spacing:.02em;
  }
  .nav{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:6px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    border-radius:var(--radius-md);
    color:var(--text-1);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border:none;
    background:transparent;
    text-align:left;
    width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:var(--bg-2);color:var(--text-0);}
  .nav-item.active{background:var(--bg-3);color:var(--text-0);}
  .nav-item.active svg{opacity:1;color:var(--green-300);}
  .nav-cta{
    margin-top:14px;
    background:var(--green-500);
    color:#08130D;
    font-weight:600;
    border:none;
    border-radius:var(--radius-md);
    padding:11px 12px;
    font-size:14px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .12s ease, transform .08s ease;
  }
  .nav-cta:hover{background:var(--green-400);}
  .nav-cta:active{transform:scale(.98);}
  .sidebar-footer{
    margin-top:auto;
    padding:10px 8px 0 8px;
    font-size:11px;
    color:var(--text-2);
    border-top:1px solid var(--line-soft);
    padding-top:14px;
  }
  .sidebar-recent{
    margin-top:20px;
    padding:0 4px;
    overflow-y:auto;
  }
  .sidebar-recent-label{
    font-size:10.5px;
    font-weight:600;
    color:var(--text-2);
    letter-spacing:.03em;
    padding:0 8px 8px 8px;
  }
  .sidebar-recent-empty{
    font-size:11.5px;
    color:var(--text-2);
    padding:6px 8px;
  }
  .sidebar-recent-item{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    border-radius:var(--radius-sm);
    padding:8px 8px;
    cursor:pointer;
    transition:background .12s ease;
  }
  .sidebar-recent-item:hover{background:var(--bg-2);}
  .sidebar-recent-item .sr-name{
    font-size:12.5px;
    color:var(--text-0);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sidebar-recent-item .sr-meta{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text-2);
    margin-top:1px;
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:34px 42px 60px 42px;
  }
  .page-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:26px;
    gap:20px;
  }
  .page-title{
    font-family:var(--font-display);
    font-size:26px;
    font-weight:600;
    color:var(--text-0);
    margin:0 0 4px 0;
  }
  .page-desc{
    color:var(--text-2);
    font-size:13.5px;
    margin:0;
    max-width:520px;
  }
  .btn{
    border:1px solid var(--line);
    background:var(--bg-2);
    color:var(--text-0);
    padding:10px 16px;
    border-radius:var(--radius-md);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:all .12s ease;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--bg-3);border-color:#33493C;}
  .btn-primary{
    background:var(--green-500);
    border-color:var(--green-500);
    color:#08130D;
    font-weight:600;
  }
  .btn-primary:hover{background:var(--green-400);border-color:var(--green-400);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-1);}
  .btn-ghost:hover{background:var(--bg-2);color:var(--text-0);}
  .btn-lg{padding:13px 22px;font-size:14.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ---------- DASHBOARD ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:28px;
  }
  .stat-card{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:18px 18px;
  }
  .stat-label{font-size:11.5px;color:var(--text-2);margin-bottom:8px;}
  .stat-value{font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--text-0);}
  .stat-value.accent{color:var(--green-300);}

  .section-label{
    font-size:13px;
    font-weight:600;
    color:var(--text-1);
    margin:0 0 12px 2px;
  }
  .job-table{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .job-row{
    display:grid;
    grid-template-columns:1.4fr 1.4fr 1fr .8fr .8fr .9fr 32px;
    gap:10px;
    padding:14px 18px;
    align-items:center;
    border-bottom:1px solid var(--line-soft);
    cursor:pointer;
    transition:background .12s ease;
  }
  .job-row:last-child{border-bottom:none;}
  .job-row:hover{background:var(--bg-2);}
  .job-row.head{
    cursor:default;
    color:var(--text-2);
    font-size:11px;
    font-weight:600;
    letter-spacing:.02em;
    padding:12px 18px;
  }
  .job-row.head:hover{background:transparent;}
  .job-cell{font-size:13.5px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-cell.strong{color:var(--text-0);font-weight:500;}
  .badge{
    display:inline-flex;align-items:center;
    padding:3px 9px;
    border-radius:999px;
    font-size:11px;
    font-weight:600;
    width:fit-content;
  }
  .badge.paid{background:rgba(67,191,116,.14);color:var(--green-300);}
  .badge.unpaid{background:rgba(227,166,63,.14);color:var(--amber);}
  .empty-state{
    padding:60px 20px;
    text-align:center;
    color:var(--text-2);
  }
  .row-delete-btn{
    background:none;
    border:none;
    color:var(--text-2);
    cursor:pointer;
    padding:6px;
    border-radius:var(--radius-sm);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .12s ease, color .12s ease;
  }
  .row-delete-btn:hover{background:rgba(226,105,92,.14);color:var(--red);}
  .empty-state svg{width:38px;height:38px;margin-bottom:14px;opacity:.5;}
  .empty-state p{margin:0 0 16px 0;font-size:13.5px;}

  /* ---------- WIZARD ---------- */
  .wizard-progress{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:30px;
  }
  .wizard-dot{
    flex:1;
    height:4px;
    border-radius:2px;
    background:var(--line);
    transition:background .18s ease;
  }
  .wizard-dot.done{background:var(--green-500);}
  .wizard-dot.current{background:var(--green-300);}
  .wizard-step-label{
    color:var(--text-2);
    font-size:12px;
    margin-bottom:6px;
    font-weight:600;
  }
  .wizard-question{
    font-family:var(--font-display);
    font-size:23px;
    font-weight:600;
    margin:0 0 22px 0;
  }
  .option-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    gap:12px;
    max-width:720px;
  }
  .option-tile{
    background:var(--bg-1);
    border:1.5px solid var(--line);
    border-radius:var(--radius-lg);
    padding:20px 16px;
    cursor:pointer;
    transition:all .12s ease;
    text-align:left;
  }
  .option-tile:hover{border-color:#33493C;background:var(--bg-2);}
  .option-tile.selected{
    border-color:var(--green-400);
    background:var(--bg-3);
    box-shadow:0 0 0 3px var(--green-glow);
  }
  .option-title{font-size:15.5px;font-weight:600;color:var(--text-0);margin-bottom:4px;}
  .option-sub{font-size:12px;color:var(--text-2);}
  .option-tile.selected .option-title{color:var(--green-300);}
  .wizard-nav{
    display:flex;
    justify-content:space-between;
    margin-top:32px;
    max-width:720px;
  }

  /* ---------- RESULT ---------- */
  .result-layout{
    display:grid;
    grid-template-columns:1fr 1.1fr;
    gap:24px;
    max-width:920px;
  }
  .price-card{
    background:radial-gradient(120% 140% at 15% 0%, var(--bg-3), var(--bg-1) 60%);
    border:1px solid #2C4536;
    border-radius:var(--radius-lg);
    padding:32px 28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .price-card::after{
    content:"";
    position:absolute;
    right:-60px;top:-60px;
    width:180px;height:180px;
    background:var(--green-glow);
    border-radius:50%;
    filter:blur(10px);
  }
  .price-eyebrow{font-size:12.5px;color:var(--text-2);font-weight:600;margin-bottom:10px;}
  .price-value{
    font-family:var(--font-display);
    font-size:56px;
    font-weight:700;
    color:var(--text-0);
    line-height:1;
    margin-bottom:4px;
  }
  .price-recommended-note{font-size:12px;color:var(--text-2);margin-bottom:22px;}
  .price-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .detail-card{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 22px;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:13.5px;
  }
  .detail-row:last-child{border-bottom:none;}
  .detail-key{color:var(--text-2);}
  .detail-val{color:var(--text-0);font-weight:500;}
  .result-footer-actions{
    display:flex;gap:10px;margin-top:22px;max-width:920px;
  }

  /* adjust price inline editor */
  .adjust-box{
    display:none;
    align-items:center;
    gap:8px;
    margin-top:14px;
  }
  .adjust-box.open{display:flex;}
  .adjust-box input{
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-sm);
    padding:8px 10px;
    font-size:15px;
    width:110px;
    font-family:var(--font-display);
  }

  /* ---------- FORMS (customer info / settings) ---------- */
  .form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    max-width:640px;
  }
  .form-grid.full{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.span-2{grid-column:span 2;}
  .field label{font-size:12.5px;color:var(--text-1);font-weight:500;}
  .field input, .field select{
    background:var(--bg-1);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-md);
    padding:10px 12px;
    font-size:14px;
    outline:none;
    transition:border-color .12s ease;
  }
  .field input:focus, .field select:focus{border-color:var(--green-400);}
  .field-hint{font-size:11px;color:var(--text-2);}
  .toggle-row{
    display:flex;gap:8px;
  }
  .toggle-pill{
    flex:1;
    text-align:center;
    padding:10px 8px;
    border-radius:var(--radius-md);
    border:1px solid var(--line);
    background:var(--bg-1);
    color:var(--text-1);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .toggle-pill.active{
    background:var(--green-500);
    border-color:var(--green-500);
    color:#08130D;
    font-weight:600;
  }
  .customer-picker{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .customer-chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--bg-1);
    font-size:12.5px;
    color:var(--text-1);
    cursor:pointer;
  }
  .customer-chip:hover{border-color:var(--green-400);color:var(--text-0);}
  .form-actions{display:flex;gap:10px;margin-top:26px;max-width:640px;}
  .collapse-toggle{
    font-size:12.5px;
    color:var(--green-300);
    cursor:pointer;
    background:none;border:none;padding:0;
    margin:4px 0 14px 0;
    font-weight:600;
  }
  .collapse-body{display:none;}
  .collapse-body.open{display:block;}

  /* ---------- SETTINGS ---------- */
  .settings-section{
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:18px;
    max-width:760px;
  }
  .settings-section h3{
    font-family:var(--font-display);
    font-size:15.5px;
    margin:0 0 4px 0;
    color:var(--text-0);
  }
  .settings-section .settings-desc{
    font-size:12px;color:var(--text-2);margin:0 0 16px 0;
  }
  .price-input-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }
  .price-input{display:flex;flex-direction:column;gap:5px;}
  .price-input label{font-size:11.5px;color:var(--text-2);}
  .price-input .prefix-wrap{position:relative;}
  .price-input .prefix-wrap span{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--text-2);font-size:13px;
  }
  .price-input input{
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--text-0);
    border-radius:var(--radius-sm);
    padding:8px 10px 8px 22px;
    font-size:13.5px;
    width:100%;
  }
  .payment-methods-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .pm-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--bg-2);
    border:1px solid var(--line);
    padding:6px 10px 6px 12px;
    border-radius:999px;
    font-size:12.5px;
  }
  .pm-chip button{
    background:none;border:none;color:var(--text-2);cursor:pointer;
    font-size:14px;line-height:1;padding:0;
  }
  .pm-chip button:hover{color:var(--red);}
  .add-pm-row{display:flex;gap:8px;}
  .add-pm-row input{flex:1;}
  .settings-save-bar{
    position:sticky;bottom:0;
    background:linear-gradient(0deg, var(--bg-0) 60%, transparent);
    padding:18px 0 0 0;
    max-width:760px;
    display:flex;gap:10px;align-items:center;
  }
  .save-confirm{font-size:12.5px;color:var(--green-300);opacity:0;transition:opacity .2s ease;}
  .save-confirm.show{opacity:1;}

  /* ---------- INVOICE PREVIEW ---------- */
  .invoice-toolbar{
    display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;
    align-items:center;
  }
  .invoice-toolbar .status-toggle{margin-left:auto;display:flex;gap:8px;}
  .paper-wrap{
    background:#0000;
    display:flex;
    justify-content:center;
  }
  #invoice-paper{
    background:var(--paper);
    color:var(--paper-ink);
    width:100%;
    max-width:680px;
    padding:52px 48px;
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    font-family:var(--font-body);
  }
  .inv-header-title{
    font-family:var(--font-display);
    font-size:12.5px;
    letter-spacing:.14em;
    color:#5C6B60;
    margin:0 0 22px 0;
  }
  .inv-business-name{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    color:var(--green-500);
    margin:0 0 6px 0;
  }
  .inv-business-meta{
    font-size:12.5px;
    color:#4C5850;
    margin:0 0 2px 0;
  }
  .inv-divider{border:none;border-top:1px solid var(--paper-line);margin:22px 0;}
  .inv-meta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    font-size:13px;
  }
  .inv-meta-grid div span.k{color:#6B7A6F;}
  .inv-meta-grid div span.v{font-weight:600;color:var(--paper-ink);}
  .inv-section-title{
    font-size:11px;
    letter-spacing:.1em;
    color:#6B7A6F;
    font-weight:700;
    margin:0 0 10px 0;
  }
  .inv-bill-to p{margin:0 0 4px 0;font-size:13.5px;}
  .inv-table{width:100%;border-collapse:collapse;margin:6px 0 4px 0;}
  .inv-table th{
    text-align:left;
    font-size:11px;
    letter-spacing:.06em;
    color:#6B7A6F;
    padding:8px 0;
    border-bottom:1.5px solid var(--paper-ink);
  }
  .inv-table th.amt, .inv-table td.amt{text-align:right;}
  .inv-table td{
    padding:14px 0;
    border-bottom:1px solid var(--paper-line);
    font-size:13.5px;
    vertical-align:top;
  }
  .inv-service-name{font-weight:700;}
  .inv-service-desc{color:#4C5850;font-size:12.5px;margin-top:3px;}
  .inv-totals{
    margin-top:16px;
    margin-left:auto;
    width:260px;
  }
  .inv-totals .row{
    display:flex;justify-content:space-between;
    font-size:13px;padding:5px 0;color:#3C463F;
  }
  .inv-totals .row.total{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:700;
    color:var(--paper-ink);
    border-top:1.5px solid var(--paper-ink);
    margin-top:6px;
    padding-top:12px;
  }
  .inv-payment-row{display:flex;justify-content:space-between;font-size:13px;margin-top:4px;}
  .inv-thanks{
    text-align:center;

<script>
/* =========================================================
   CONFIG
========================================================= */
const DEFAULT_CONFIG = {
  business:{
    name:"Longreen Lawn Care",
    phone:"719-352-7696",
    email:"contactlongreen@gmail.com",
    location:"Colorado Springs, Colorado 80906"
  },
  pricing:{
    lawnSize:{ mini:25, small:32, medium:40, large:52, xlarge:68 },
    weedeating:{ none:-5, light:0, normal:8, heavy:18 },
    edging:{ no:0, yes:8 },
    blowing:{ no:0, yes:5 },
    overgrowth:{ low:-5, normal:0, high:15 },
    travel:{ "0-5":0, "5-10":5, "10+":12 },
    minimumJobPrice:30
  },
  time:{
    lawnSize:{ mini:20, small:30, medium:45, large:60, xlarge:80 },
    weedeating:{ none:0, light:5, normal:10, heavy:20 },
    edging:{ no:0, yes:10 },
    blowing:{ no:0, yes:5 },
    overgrowth:{ low:-5, normal:0, high:15 }
  },
  taxRate:0,
  paymentMethods:["Cash","Check","PayPal","Venmo"]
};

const LABELS = {
  lawnSize:{ mini:"Mini", small:"Small", medium:"Medium", large:"Large", xlarge:"2× Large" },
  weedeating:{ none:"None", light:"Light", normal:"Normal", heavy:"Heavy" },
  edging:{ no:"No", yes:"Yes" },
  blowing:{ no:"No", yes:"Yes" },
  overgrowth:{ low:"Low", normal:"Normal", high:"High" },
  travel:{ "0-5":"0–5 miles", "5-10":"5–10 miles", "10+":"10+ miles" }
};

const DESC_WEEDEATING = { light:"Light Weedeating", normal:"Weedeating", heavy:"Heavy Weedeating" };

const FREQUENCY_LABELS = { onetime:"One time", weekly:"Weekly", biweekly:"Every 2 weeks", triweekly:"Every 3 weeks", monthly:"Monthly" };
const FREQUENCY_DAYS = { weekly:7, biweekly:14, triweekly:21 };
const DOW_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_LABELS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const WIZARD_STEPS = [
  { key:"size", question:"What size is the lawn?", options:[
      {v:"mini", t:"Mini", s:"Tiny lot or patch"},
      {v:"small", t:"Small", s:"Typical small yard"},
      {v:"medium", t:"Medium", s:"Standard residential"},
      {v:"large", t:"Large", s:"Big residential lot"},
      {v:"xlarge", t:"2× Large", s:"Very large property"}
    ]},
  { key:"weedeating", question:"How much weedeating?", options:[
      {v:"none", t:"None", s:"Skip weedeating"},
      {v:"light", t:"Light", s:"Quick touch-up"},
      {v:"normal", t:"Normal", s:"Standard pass"},
      {v:"heavy", t:"Heavy", s:"Overgrown edges"}
    ]},
  { key:"edging", question:"Include edging?", options:[
      {v:"no", t:"No", s:"Skip edging"},
      {v:"yes", t:"Yes", s:"Edge walkways & beds"}
    ]},
  { key:"blowing", question:"Include blowing?", options:[
      {v:"no", t:"No", s:"Skip blowing"},
      {v:"yes", t:"Yes", s:"Clear clippings & debris"}
    ]},
  { key:"overgrowth", question:"How overgrown is the property?", options:[
      {v:"low", t:"Low", s:"Well maintained"},
      {v:"normal", t:"Normal", s:"Typical growth"},
      {v:"high", t:"High", s:"Significant overgrowth"}
    ]},
  { key:"travel", question:"How far is the travel distance?", options:[
      {v:"0-5", t:"0–5 miles", s:"Close by"},
      {v:"5-10", t:"5–10 miles", s:"Short drive"},
      {v:"10+", t:"10+ miles", s:"Longer drive"}
    ]}
];

/* =========================================================
   STORAGE
   Wrapped so a blocked/unavailable localStorage (common when a
   file is opened directly as file:// in Safari, or in private
   browsing) never throws and silently kills a button click —
   it falls back to an in-memory store for the session instead.
========================================================= */
const memoryFallback = {};
let usingMemoryFallback = false;

function safeGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ usingMemoryFallback = true; return memoryFallback[key] ?? null; }
}
function safeSet(key, value){
  try{ localStorage.setItem(key, value); }
  catch(e){ usingMemoryFallback = true; memoryFallback[key] = value; }
}

const Store = {
  getConfig(){
    const raw = safeGet("longreen_config");
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    try{
      const parsed = JSON.parse(raw);
      return deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), parsed);
    }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_CONFIG)); }
  },
  setConfig(cfg){ safeSet("longreen_config", JSON.stringify(cfg)); },
  getCustomers(){ try{ return JSON.parse(safeGet("longreen_customers") || "[]"); }catch(e){ return []; } },
  setCustomers(list){ safeSet("longreen_customers", JSON.stringify(list)); },
  getJobs(){ try{ return JSON.parse(safeGet("longreen_jobs") || "[]"); }catch(e){ return []; } },
  setJobs(list){ safeSet("longreen_jobs", JSON.stringify(list)); }
};
function deepMerge(base, override){
  for(const k in override){
    if(override[k] && typeof override[k] === "object" && !Array.isArray(override[k])){
      base[k] = deepMerge(base[k] || {}, override[k]);
    }else{
      base[k] = override[k];
    }
  }
  return base;
}

/* =========================================================
   STATE
========================================================= */
const State = {
  page:"dashboard",
  wizardStep:0,
  selections:{},
  manualPrice:null,
  activeJob:null,       // job being viewed/created
  editingCustomerId:null,
  invoiceDraft:null,
  activeCustomerId:null,
  jobDetailReturn:"jobs",
  customerSearch:"",
  jobsFilter:"all",
  scheduleMonth:null,   // {y, m} — set on first schedule render
  recurringFormOpen:false,
  showAddCustomerForm:false
};

/* =========================================================
   PRICING ENGINE
========================================================= */
function computeRecommendedPrice(config, sel){
  const p = config.pricing;
  let price = p.lawnSize[sel.size] + p.weedeating[sel.weedeating] + p.edging[sel.edging]
    + p.blowing[sel.blowing] + p.overgrowth[sel.overgrowth] + p.travel[sel.travel];
  return Math.max(Math.round(price), p.minimumJobPrice);
}
function computeDurationMinutes(config, sel){
  const t = config.time;
  let mins = t.lawnSize[sel.size] + t.weedeating[sel.weedeating] + t.edging[sel.edging]
    + t.blowing[sel.blowing] + t.overgrowth[sel.overgrowth];
  return Math.max(Math.round(mins), 10);
}
function buildServiceDescription(sel){
  const parts = [LABELS.lawnSize[sel.size], "Mowing"];
  if(sel.weedeating !== "none") parts.push(DESC_WEEDEATING[sel.weedeating]);
  if(sel.edging === "yes") parts.push("Edging");
  if(sel.blowing === "yes") parts.push("Blowing");
  if(sel.overgrowth === "high") parts.push("Overgrowth Cleanup");
  return parts.join(" · ");
}
function formatMoney(n){
  return "$" + (Math.round(n * 100) / 100).toFixed(2);
}
function formatDuration(mins){
  if(mins < 60) return mins + " min";
  const h = Math.floor(mins/60), m = mins % 60;
  return h + "h" + (m ? " " + m + "m" : "");
}

/* =========================================================
   UTIL
========================================================= */
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDaysISO(iso, n){
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function addMonthISO(iso){
  const d = new Date(iso + "T00:00:00");
  d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0,10);
}
function formatTimeNice(t){
  if(!t) return "";
  const [h,m] = t.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}
function formatDateNice(iso){
  if(!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}
function nextInvoiceNumber(){
  const jobs = Store.getJobs();
  let max = 0;
  jobs.forEach(j=>{
    const m = /(\d+)$/.exec(j.invoiceNumber || "");
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "LG-" + String(max+1).padStart(4,"0");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove("show"), 2600);
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   DATA MIGRATION
   Fills in fields added by later versions of the app so jobs
   and customers saved before this update keep working.
========================================================= */
function migrateData(){
  let jobs = Store.getJobs();
  let jobsChanged = false;
  jobs = jobs.map(j=>{
    const p = { ...j };
    if(!p.status){ p.status = p.paymentStatus === "Paid" ? "Completed" : "Scheduled"; jobsChanged = true; }
    if(p.amountPaid === undefined){ p.amountPaid = p.paymentStatus === "Paid" ? p.total : 0; jobsChanged = true; }
    if(p.paymentDate === undefined){ p.paymentDate = p.paymentStatus === "Paid" ? (p.invoiceDate || todayISO()) : null; jobsChanged = true; }
    if(p.scheduledTime === undefined){ p.scheduledTime = "10:00"; jobsChanged = true; }
    if(p.notes === undefined){ p.notes = ""; jobsChanged = true; }
    if(p.recurringId === undefined){ p.recurringId = null; jobsChanged = true; }
    return p;
  });
  if(jobsChanged) Store.setJobs(jobs);

  let customers = Store.getCustomers();
  let customersChanged = false;
  customers = customers.map(c=>{
    const p = { ...c };
    if(p.notes === undefined){ p.notes = ""; customersChanged = true; }
    if(p.dateAdded === undefined){ p.dateAdded = todayISO(); customersChanged = true; }
    if(p.recurring === undefined){ p.recurring = null; customersChanged = true; }
    return p;
  });
  if(customersChanged) Store.setCustomers(customers);
}

/* =========================================================
   RECURRING JOBS
========================================================= */
function makeRecurringJob(cust, rec, dateOverride){
  const config = Store.getConfig();
  const date = dateOverride || rec.nextDate;
  return {
    id: uid("job"),
    invoiceNumber: nextInvoiceNumber(),
    customerId: cust.id, customerName: cust.name, propertyAddress: cust.address,
    customerPhone: cust.phone, customerEmail: cust.email,
    quote: { ...rec.quote, price: rec.price, recommended: rec.price, duration: computeDurationMinutes(config, rec.quote), description: buildServiceDescription(rec.quote) },
    subtotal: rec.price, discount:0, taxPct: config.taxRate, tax:0, total: rec.price,
    serviceDate: date, scheduledTime: rec.time || "10:00",
    invoiceDate: date, dueDate: date,
    paymentMethod: config.paymentMethods[0] || "Cash",
    paymentStatus: "Unpaid", amountPaid:0, paymentDate:null,
    status: "Scheduled",
    notes:"",
    recurringId: rec.id,
    createdAt: Date.now()
  };
}
function ensureUpcomingRecurringJobs(){
  const customers = Store.getCustomers();
  const jobs = Store.getJobs();
  const horizon = addDaysISO(todayISO(), 56); // generate 8 weeks ahead
  let custChanged = false;
  let jobsChanged = false;

  customers.forEach(cust=>{
    const rec = cust.recurring;
    if(!rec) return;

    if(rec.frequency === "onetime"){
      if(!rec.generated){
        jobs.push(makeRecurringJob(cust, rec));
        rec.generated = true;
        custChanged = true; jobsChanged = true;
      }
      return;
    }

    let guard = 0;
    while(rec.nextDate && rec.nextDate <= horizon && guard < 12){
      const exists = jobs.some(j=> j.recurringId === rec.id && j.serviceDate === rec.nextDate);
      if(!exists){
        jobs.push(makeRecurringJob(cust, rec, rec.nextDate));
        jobsChanged = true;
      }
      rec.nextDate = rec.frequency === "monthly" ? addMonthISO(rec.nextDate) : addDaysISO(rec.nextDate, FREQUENCY_DAYS[rec.frequency] || 7);
      custChanged = true;
      guard++;
    }
  });

  if(custChanged) Store.setCustomers(customers);
  if(jobsChanged) Store.setJobs(jobs);
}

function setJobField(jobId, patch){
  const jobs = Store.getJobs();
  const idx = jobs.findIndex(j=>j.id===jobId);
  if(idx < 0) return null;
  jobs[idx] = { ...jobs[idx], ...patch };
  Store.setJobs(jobs);
  if(State.activeJob && State.activeJob.id === jobId) State.activeJob = jobs[idx];
  return jobs[idx];
}
function getCustomerStats(customerId){
  const jobs = Store.getJobs().filter(j=> j.customerId === customerId && j.status !== "Cancelled");
  const today = todayISO();
  const totalJobs = jobs.length;
  const totalRevenue = jobs.reduce((s,j)=> s + (j.paymentStatus === "Paid" ? (j.amountPaid||j.total) : 0), 0);
  const totalUnpaid = jobs.reduce((s,j)=> s + (j.paymentStatus === "Paid" ? 0 : Math.max(0, j.total - (j.amountPaid||0))), 0);
  const past = jobs.filter(j=> j.serviceDate && j.serviceDate <= today).sort((a,b)=> b.serviceDate.localeCompare(a.serviceDate));
  const future = jobs.filter(j=> j.status === "Scheduled" && j.serviceDate && j.serviceDate >= today).sort((a,b)=> a.serviceDate.localeCompare(b.serviceDate));
  return {
    totalJobs, totalRevenue, totalUnpaid,
    lastService: past[0]?.serviceDate || null,
    nextService: future[0]?.serviceDate || null
  };
}

  dt.setDate(dt.getDate() - dt.getDay());

function deleteJob(jobId){
  const jobs = Store.getJobs();
  const job = jobs.find(j=>j.id === jobId);
  if(!job) return;
  if(!confirm(`Delete invoice ${job.invoiceNumber} for ${job.customerName}? This can't be undone.`)) return;
  Store.setJobs(jobs.filter(j=>j.id !== jobId));
  if(State.activeJob && State.activeJob.id === jobId){
    State.activeJob = null;
    navigate("dashboard");
  }else{
    render();
  }
  showToast("Invoice deleted.");
}

          </div>
        </div>
      </div>

      <button type="button" class="collapse-toggle" id="adj-toggle">+ Add discount or tax adjustment</button>
      <div class="collapse-body" id="adj-body">
        <div class="form-grid">
          <div class="field">
            <label>Discount ($)</label>
            <input type="number" id="f-discount" value="0" step="0.01" min="0">
          </div>
          <div class="field">
            <label>Tax (%)</label>
            <input type="number" id="f-tax" value="${config.taxRate}" step="0.01" min="0">
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-lg">Generate Invoice →</button>
      </div>
    </form>
  `;

  document.getElementById("ci-back").addEventListener("click", ()=>{ State.page = "result"; render(); });

  let paymentStatus = "Unpaid";
  document.querySelectorAll(".toggle-pill").forEach(el=>{
    el.addEventListener("click", ()=>{
      document.querySelectorAll(".toggle-pill").forEach(p=>p.classList.remove("active"));
      el.classList.add("active");
      paymentStatus = el.dataset.status;
    });
  });

  document.getElementById("adj-toggle").addEventListener("click", ()=>{
    const body = document.getElementById("adj-body");
    const open = body.classList.toggle("open");
    document.getElementById("adj-toggle").textContent = open ? "− Hide discount / tax adjustment" : "+ Add discount or tax adjustment";
  });

  document.querySelectorAll(".customer-chip").forEach(el=>{
    el.addEventListener("click", ()=>{
      const c = customers.find(x=>x.id === el.dataset.cid);
      if(!c) return;
      document.getElementById("f-name").value = c.name;
      document.getElementById("f-address").value = c.address;
      document.getElementById("f-phone").value = c.phone || "";
      document.getElementById("f-email").value = c.email || "";
      State.editingCustomerId = c.id;
    });
  });

  document.getElementById("ci-form").addEventListener("submit", (e)=>{
    e.preventDefault();
    try{
      submitInvoiceForm();
    }catch(err){
      console.error(err);
      showToast("Something went wrong generating the invoice — please try again.");
    }
  });

  function submitInvoiceForm(){
    const name = document.getElementById("f-name").value.trim();
    const address = document.getElementById("f-address").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const email = document.getElementById("f-email").value.trim();
    if(!name || !address){ showToast("Customer name and property address are required."); return; }

    // save / update customer
    let customerId = State.editingCustomerId;
    const list = Store.getCustomers();
    if(customerId){
      const idx = list.findIndex(c=>c.id === customerId);
      if(idx > -1){ list[idx] = { ...list[idx], name, address, phone, email }; }
    }else{
      const existing = list.find(c=> c.name.toLowerCase() === name.toLowerCase() && c.address.toLowerCase() === address.toLowerCase());
      if(existing){
        customerId = existing.id;
        existing.phone = phone || existing.phone;
        existing.email = email || existing.email;
      }else{
        customerId = uid("cust");
        list.push({ id:customerId, name, address, phone, email, notes:"", dateAdded: todayISO(), recurring:null });
      }
    }
    Store.setCustomers(list);

    const discount = parseFloat(document.getElementById("f-discount")?.value || 0) || 0;
    const taxPct = parseFloat(document.getElementById("f-tax")?.value || 0) || 0;
    const subtotal = finalPrice;
    const tax = Math.round((subtotal - discount) * (taxPct/100) * 100) / 100;
    const total = Math.round((subtotal - discount + tax) * 100) / 100;

    const job = {
      id: uid("job"),
      invoiceNumber: document.getElementById("f-invnum").value.trim() || invoiceNumber,
      customerId, customerName:name, propertyAddress:address, customerPhone:phone, customerEmail:email,
      invoiceDate: document.getElementById("f-invdate").value,
      serviceDate: document.getElementById("f-servdate").value,
      scheduledTime: document.getElementById("f-servtime").value || "10:00",
      dueDate: document.getElementById("f-duedate").value,
      paymentMethod: document.getElementById("f-paymethod").value,
      paymentStatus,
      amountPaid: paymentStatus === "Paid" ? total : 0,
      paymentDate: paymentStatus === "Paid" ? document.getElementById("f-invdate").value : null,
      status: "Scheduled",
      notes: "",
      recurringId: null,
      quote:{ ...sel, price:finalPrice, recommended, duration:computeDurationMinutes(config, sel), description: buildServiceDescription(sel) },
      subtotal, discount, taxPct, tax, total,
      createdAt: Date.now()
    };

    const jobs = Store.getJobs();
    jobs.push(job);
    Store.setJobs(jobs);

    State.activeJob = job;
    State.page = "invoice";
    render();
  }
}

function setJobStatus(jobId, paymentStatus){
  const job = Store.getJobs().find(j=>j.id === jobId);
  if(!job) return;
  const patch = { paymentStatus };
  if(paymentStatus === "Paid"){
    patch.amountPaid = job.total;
    patch.paymentDate = todayISO();
    if(job.status === "Scheduled") patch.status = "Completed";
  }else{
    patch.amountPaid = 0;
    patch.paymentDate = null;
  }
  setJobField(jobId, patch);
  render();
  showToast("Marked as " + paymentStatus);
}

function downloadInvoicePdf(job){
  const el = document.getElementById("invoice-paper");
  const opt = {
    margin:0,
    filename:`${job.invoiceNumber}-${job.customerName.replace(/\s+/g,'-')}.pdf`,
    image:{ type:"jpeg", quality:0.98 },
    html2canvas:{ scale:2, backgroundColor:"#F6F4EC" },
    jsPDF:{ unit:"pt", format:"letter", orientation:"portrait" }
  };
  if(typeof html2pdf === "undefined"){
    showToast("PDF library failed to load — check your internet connection.");
    return;
  }
  showToast("Preparing PDF…");
  html2pdf().set(opt).from(el).save();
}

function shareInvoice(job){
  const summary = `Invoice ${job.invoiceNumber} — ${job.customerName}\n${job.quote.description}\nTotal Due: ${formatMoney(job.total)}\nStatus: ${job.paymentStatus}\n\nLongreen Lawn Care · 719-352-7696`;
  if(navigator.share){
    navigator.share({ title:`Invoice ${job.invoiceNumber}`, text:summary }).catch(()=>{});
  }else{
    navigator.clipboard?.writeText(summary);
    showToast("Invoice summary copied — paste it into a text or email.");
  }
}

function renderRecurringFormHtml(cust){

  const price = rec ? rec.price : computeRecommendedPrice(config, q);
  const nextDate = rec ? rec.nextDate : addDaysISO(todayISO(), 7);
  const time = rec ? rec.time : "10:00";

  function opts(key){
    return Object.keys(LABELS[key]).map(v=> `<option value="${v}" ${q[key]===v?"selected":""}>${LABELS[key][v]}</option>`).join("");
  }

  return `

        <select id="rec-frequency">
          ${Object.keys(FREQUENCY_LABELS).map(f=>`<option value="${f}" ${rec && rec.frequency===f ? "selected":""}>${FREQUENCY_LABELS[f]}</option>`).join("")}

      <div class="field"><label>Time</label><input type="time" id="rec-time" value="${time}"></div>
      <div class="field"><label>Lawn Size</label><select id="rec-size">${opts("lawnSize")}</select></div>
      <div class="field"><label>Weedeating</label><select id="rec-weedeating">${opts("weedeating")}</select></div>
      <div class="field"><label>Edging</label><select id="rec-edging">${opts("edging")}</select></div>
      <div class="field"><label>Blowing</label><select id="rec-blowing">${opts("blowing")}</select></div>
      <div class="field"><label>Overgrowth</label><select id="rec-overgrowth">${opts("overgrowth")}</select></div>

function wireRecurringForm(cust){
  const form = document.getElementById("recurring-form");
  if(!form) return;
  const config = Store.getConfig();
  const recalcPrice = ()=>{
    const sel = readRecurringSelects();
    const priceInput = document.getElementById("rec-price");
    if(priceInput) priceInput.value = computeRecommendedPrice(config, sel);
  };
  function readRecurringSelects(){
    return {
      size: document.getElementById("rec-size")?.value,
      weedeating: document.getElementById("rec-weedeating")?.value,
      edging: document.getElementById("rec-edging")?.value,
      blowing: document.getElementById("rec-blowing")?.value,
      overgrowth: document.getElementById("rec-overgrowth")?.value,
      travel: document.getElementById("rec-travel")?.value
    };
  }
  ["rec-size","rec-weedeating","rec-edging","rec-blowing","rec-overgrowth","rec-travel"].forEach(id=>{
    document.getElementById(id)?.addEventListener("change", recalcPrice);
  });
  document.getElementById("rec-cancel")?.addEventListener("click", ()=>{
    State.recurringFormOpen = false;
    render();
  });
  document.getElementById("rec-save")?.addEventListener("click", ()=>{
    const frequency = document.getElementById("rec-frequency").value;
    const date = document.getElementById("rec-date").value;
    const time = document.getElementById("rec-time").value || "10:00";
    const price = parseFloat(document.getElementById("rec-price").value) || 0;
    const quote = readRecurringSelects();
    const customers = Store.getCustomers();
    const idx = customers.findIndex(c=>c.id === cust.id);
    if(idx < 0) return;
    const existing = customers[idx].recurring;
    customers[idx].recurring = {
      id: existing?.id || uid("rec"),
      frequency, time, quote, price,
      nextDate: date,
      generated: false
    };
    Store.setCustomers(customers);
    State.recurringFormOpen = false;
    render();
    showToast("Recurring service saved.");
  });
}

function stopRecurring(customerId){
  if(!confirm("Stop recurring service for this customer? Upcoming auto-scheduled jobs that haven't happened yet will be removed. Past jobs stay on their history.")) return;
  const customers = Store.getCustomers();
  const cust = customers.find(c=>c.id === customerId);
  if(!cust || !cust.recurring) return;
  const recId = cust.recurring.id;
  cust.recurring = null;
  Store.setCustomers(customers);
  const jobs = Store.getJobs().filter(j=> !(j.recurringId === recId && j.status === "Scheduled" && j.serviceDate >= todayISO()));
  Store.setJobs(jobs);
  render();
  showToast("Recurring service stopped.");
}

/* ---------------- SCHEDULE ---------------- */
function renderSchedule(){
  if(!State.scheduleMonth){
    const n = new Date();
    State.scheduleMonth = { y:n.getFullYear(), m:n.getMonth() };
  }
  const { y, m } = State.scheduleMonth;
  const jobs = Store.getJobs();
  const jobsByDate = {};
  jobs.forEach(j=>{ if(!j.serviceDate) return; (jobsByDate[j.serviceDate] = jobsByDate[j.serviceDate] || []).push(j); });

  const firstOfMonth = new Date(y, m, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const daysInPrevMonth = new Date(y, m, 0).getDate();
  const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;
  const today = todayISO();

  const cells = [];
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startWeekday + 1;
    let cellDate, otherMonth = false;
    if(dayNum < 1){ cellDate = new Date(y, m-1, daysInPrevMonth + dayNum); otherMonth = true; }
    else if(dayNum > daysInMonth){ cellDate = new Date(y, m+1, dayNum - daysInMonth); otherMonth = true; }
    else{ cellDate = new Date(y, m, dayNum); }
    const iso = cellDate.toISOString().slice(0,10);
    cells.push({ iso, dayNum: cellDate.getDate(), otherMonth });
  }

  main.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Schedule</h1>
        <p class="page-desc">What's booked, day by day.</p>
      </div>
      <button class="btn btn-primary btn-lg" id="sched-new-quote">+ New Quote</button>
    </div>

    <div class="cal-toolbar">
      <button class="btn" id="cal-prev">← Prev</button>
      <div class="cal-month-label">${MONTH_LABELS[m]} ${y}</div>
      <button class="btn" id="cal-next">Next →</button>
      <button class="btn btn-ghost" id="cal-today">Today</button>
    </div>

    <div class="cal-grid">
      ${DOW_LABELS.map(d=>`<div class="cal-dow">${d}</div>`).join("")}
      ${cells.map(c=>{
        const dayJobs = (jobsByDate[c.iso] || []).sort((a,b)=> (a.scheduledTime||"").localeCompare(b.scheduledTime||""));
        const shown = dayJobs.slice(0,3);
        const extra = dayJobs.length - shown.length;
        return `
          <div class="cal-cell ${c.otherMonth ? "other-month" : ""} ${c.iso === today ? "today" : ""}">
            <div class="cal-date-num">${c.dayNum}</div>
            ${shown.map(j=>`
              <div class="cal-job-chip ${j.paymentStatus==='Paid' ? 'paid' : j.status.toLowerCase()}" data-job="${j.id}" title="${escapeHtml(j.customerName)} — ${escapeHtml(j.quote.description)}">
                ${formatTimeNice(j.scheduledTime)} ${escapeHtml(j.customerName)}
              </div>
            `).join("")}
            ${extra > 0 ? `<div class="cal-more">+${extra} more</div>` : ""}
          </div>
        `;
      }).join("")}
    </div>
  `;

  document.getElementById("sched-new-quote").addEventListener("click", startNewQuote);
  document.getElementById("cal-prev").addEventListener("click", ()=>{
    State.scheduleMonth.m--;
    if(State.scheduleMonth.m < 0){ State.scheduleMonth.m = 11; State.scheduleMonth.y--; }
    render();
  });
  document.getElementById("cal-next").addEventListener("click", ()=>{
    State.scheduleMonth.m++;
    if(State.scheduleMonth.m > 11){ State.scheduleMonth.m = 0; State.scheduleMonth.y++; }
    render();
  });
  document.getElementById("cal-today").addEventListener("click", ()=>{
    const n = new Date();
    State.scheduleMonth = { y:n.getFullYear(), m:n.getMonth() };
    render();
  });
  document.querySelectorAll(".cal-job-chip").forEach(el=>{
    el.addEventListener("click", ()=> gotoJobDetail(el.dataset.job, "schedule"));
  });
}

function saveJobEdits(jobId){
  const job = Store.getJobs().find(j=>j.id === jobId);
  if(!job) return;
  const serviceDate = document.getElementById("jd-date").value;
  const scheduledTime = document.getElementById("jd-time").value || "10:00";
  const subtotal = parseFloat(document.getElementById("jd-subtotal").value) || 0;
  const discount = parseFloat(document.getElementById("jd-discount").value) || 0;
  const notes = document.getElementById("jd-notes").value;
  const taxPct = job.taxPct || 0;
  const tax = Math.round((subtotal - discount) * (taxPct/100) * 100) / 100;
  const total = Math.round((subtotal - discount + tax) * 100) / 100;
  setJobField(jobId, { serviceDate, scheduledTime, subtotal, discount, tax, total, notes });
  render();
  showToast("Job updated.");
}
function toggleJobCompleted(jobId){
  const job = Store.getJobs().find(j=>j.id === jobId);
  if(!job) return;
  const newStatus = job.status === "Completed" ? "Scheduled" : "Completed";
  setJobField(jobId, { status:newStatus });
  render();
  showToast(newStatus === "Completed" ? "Marked completed." : "Reverted to scheduled.");
}
function toggleJobCancelled(jobId){
  const job = Store.getJobs().find(j=>j.id === jobId);
  if(!job) return;
  if(job.status === "Cancelled"){
    setJobField(jobId, { status:"Scheduled" });
    showToast("Job reactivated.");
  }else{
    if(!confirm("Cancel this job?")) return;
    setJobField(jobId, { status:"Cancelled" });
    showToast("Job cancelled.");
  }
  render();
}
function recordPayment(jobId, amount, method, date){
  const job = Store.getJobs().find(j=>j.id === jobId);
  if(!job) return;
  const newAmountPaid = Math.round(amount * 100) / 100;
  const patch = {
    amountPaid: newAmountPaid,
    paymentMethod: method,
    paymentDate: date,
    paymentStatus: newAmountPaid >= job.total ? "Paid" : "Unpaid"
  };
  if(patch.paymentStatus === "Paid" && job.status === "Scheduled") patch.status = "Completed";
  setJobField(jobId, patch);
  render();
  showToast(patch.paymentStatus === "Paid" ? "Payment recorded — marked Paid." : "Partial payment recorded.");
}
function rebookJob(originalJob, newDate, newTime){
  const newJob = {
    ...JSON.parse(JSON.stringify(originalJob)),
    id: uid("job"),
    invoiceNumber: nextInvoiceNumber(),
    serviceDate: newDate,
    scheduledTime: newTime,
    invoiceDate: todayISO(),
    dueDate: newDate,
    paymentStatus: "Unpaid",
    amountPaid: 0,
    paymentDate: null,
    status: "Scheduled",
    recurringId: null,
    createdAt: Date.now()
  };
  const jobs = Store.getJobs();
  jobs.push(newJob);
  Store.setJobs(jobs);
  showToast("Rebooked for " + formatDateNice(newDate));
  gotoJobDetail(newJob.id, State.jobDetailReturn);
}

      <p class="settings-desc">Adjustment relative to the baseline job.</p>
      <div class="price-input-grid">
        ${Object.keys(config.pricing.weedeating).map(k=>`
          <div class="price-input"><label>${LABELS.weedeating[k]}</label>
            <div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.weedeating.${k}" value="${config.pricing.weedeating[k]}"></div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="settings-section">
      <h3>Edging &amp; Blowing</h3>
      <p class="settings-desc">Flat add-on when included.</p>
      <div class="price-input-grid">
        <div class="price-input"><label>Edging (Yes)</label><div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.edging.yes" value="${config.pricing.edging.yes}"></div></div>
        <div class="price-input"><label>Blowing (Yes)</label><div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.blowing.yes" value="${config.pricing.blowing.yes}"></div></div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Overgrowth Pricing</h3>
      <div class="price-input-grid">
        ${Object.keys(config.pricing.overgrowth).map(k=>`
          <div class="price-input"><label>${LABELS.overgrowth[k]}</label>
            <div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.overgrowth.${k}" value="${config.pricing.overgrowth[k]}"></div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="settings-section">
      <h3>Travel Pricing</h3>
      <div class="price-input-grid">
        ${Object.keys(config.pricing.travel).map(k=>`
          <div class="price-input"><label>${LABELS.travel[k]}</label>
            <div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.travel.${k}" value="${config.pricing.travel[k]}"></div>
          </div>
        `).join("")}
      </div>
    </div>

    <div class="settings-section">
      <h3>Minimum Job Price &amp; Tax</h3>
      <div class="price-input-grid">
        <div class="price-input"><label>Minimum job price</label><div class="prefix-wrap"><span>$</span><input type="number" step="1" data-path="pricing.minimumJobPrice" value="${config.pricing.minimumJobPrice}"></div></div>
        <div class="price-input"><label>Default tax rate (%)</label><div class="prefix-wrap"><span>%</span><input type="number" step="0.01" data-path="taxRate" value="${config.taxRate}"></div></div>
      </div>
    </div>

    <div class="settings-section">
      <h3>Default Payment Methods</h3>
      <div class="payment-methods-list" id="pm-list">
        ${config.paymentMethods.map((m,i)=>`
          <div class="pm-chip" data-idx="${i}">${escapeHtml(m)} <button type="button" data-remove="${i}">×</button></div>
        `).join("")}
      </div>
      <div class="add-pm-row">
        <input type="text" id="pm-new" placeholder="Add a payment method">
        <button class="btn" id="pm-add">Add</button>
      </div>
    </div>

    <div class="settings-save-bar">
      <button class="btn btn-primary btn-lg" id="settings-save">Save Settings</button>
      <span class="save-confirm" id="save-confirm">Saved ✓</span>
    </div>
  `;

  let workingConfig = JSON.parse(JSON.stringify(config));

  main.querySelectorAll("[data-path]").forEach(input=>{
    input.addEventListener("input", ()=>{
      const path = input.dataset.path.split(".");
      let obj = workingConfig;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      obj[path[path.length-1]] = parseFloat(input.value) || 0;
    });
  });

  document.getElementById("pm-add").addEventListener("click", ()=>{
    const v = document.getElementById("pm-new").value.trim();
    if(!v) return;
    workingConfig.paymentMethods.push(v);
    Store.setConfig(workingConfig);
    renderSettings();
  });
  main.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.remove,10);
      workingConfig.paymentMethods.splice(idx,1);
      Store.setConfig(workingConfig);
      renderSettings();
    });
  });

  document.getElementById("settings-reset").addEventListener("click", ()=>{
    if(confirm("Reset all pricing and business settings to defaults?")){
      Store.setConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
      renderSettings();
      showToast("Settings reset to defaults.");
    }
  });

  document.getElementById("settings-save").addEventListener("click", ()=>{
    workingConfig.business.name = document.getElementById("s-biz-name").value.trim() || DEFAULT_CONFIG.business.name;
    workingConfig.business.phone = document.getElementById("s-biz-phone").value.trim();
    workingConfig.business.email = document.getElementById("s-biz-email").value.trim();
    workingConfig.business.location = document.getElementById("s-biz-location").value.trim();
    Store.setConfig(workingConfig);
    const c = document.getElementById("save-confirm");
    c.classList.add("show");
    setTimeout(()=>c.classList.remove("show"), 2200);
  });
}
